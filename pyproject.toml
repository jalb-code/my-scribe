[project]
name = "my-scribe"
version = "2.0.0"
description = "Transcription audio/vidéo → texte (français) via faster-whisper"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.1.0",
    "typer>=0.12.0",
    "loguru>=0.7.2",
    "huggingface-hub>=0.25.0",
]

[tool.uv]
# faster-whisper embarque ctranslate2 + PyAV (décodage audio/vidéo) :
# pas besoin de torch ni du binaire ffmpeg pour l'inférence CPU.

# Outils de qualité (non installés en production). Installés via `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

# ----------------------------------------------------------------------------
# Ruff : linter + formateur (remplace flake8, isort, black, pyupgrade...)
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplify, RUF règles Ruff.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003 : caractères unicode « ambigus » — ici volontaires
# (typographie française : « × », « … », espaces fines).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument en valeur par défaut est le pattern idiomatique de Typer.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Les tests peuvent utiliser des assertions et des noms courts.
"tests/**" = ["N802", "N806"]

# ----------------------------------------------------------------------------
# mypy : vérification de types statique
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
warn_unused_ignores = true
warn_redundant_casts = true

# Les libs C (faster-whisper, ctranslate2, av, onnxruntime) n'ont pas de stubs.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "av.*", "onnxruntime.*", "huggingface_hub.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
