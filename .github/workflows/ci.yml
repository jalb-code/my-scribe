name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv (+ Python épinglé par .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer les dépendances (dont le dev group)
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy (types)
        run: uv run mypy transcribe.py

      - name: pytest
        run: uv run pytest

  # Scan de vulnérabilités : échoue si une CVE HIGH/CRITICAL corrigeable
  # est présente dans les dépendances (lecture de uv.lock).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Trivy (script officiel Aqua)
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy — CVE HIGH/CRITICAL corrigeables (dépendances)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .
